name: Release gates

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      usability_passed:
        description: Confirm a non-developer completed the first-task checklist
        required: true
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run graphify:check
      - run: npm run package:vsix
      - run: xvfb-run -a npm run test:extension
      - run: xvfb-run -a npm run test:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: bot-rider-${{ github.sha }}
          path: artifacts/*.vsix
          if-no-files-found: error

  usability-release-gate:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit first-task usability attestation
        env:
          MANUAL_ATTESTATION: ${{ inputs.usability_passed }}
        run: node scripts/usability-gate.mjs
